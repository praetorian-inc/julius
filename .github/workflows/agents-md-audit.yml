name: Instruction-File Audit
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
concurrency:
  group: agents-md-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audit:
    uses: praetorian-inc/public-workflows/.github/workflows/agents-md-audit.yml@aaa895ad25fda4d6600e64e2f5d41dd3afdc2a13  # v2.21.3
    permissions:
      contents: read
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PALATINE_SKILLS_APP_ID: ${{ secrets.PALATINE_SKILLS_APP_ID }}
      PALATINE_SKILLS_PRIVATE_KEY: ${{ secrets.PALATINE_SKILLS_PRIVATE_KEY }}
