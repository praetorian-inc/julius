name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.golangci*'
      - 'Makefile'
      # Probe definitions and their test fixtures are validated by the Go test
      # suite (pkg/scanner/fixture_test.go), so edits to them must run CI too.
      - 'probes/**'
      - 'pkg/scanner/testdata/fixtures/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: praetorian-inc/public-workflows/.github/workflows/go-ci.yml@0c602372f3d0d038912dd08e159ecc83954a4995  # v2.9.3
    permissions:
      contents: read
    with:
      build-cmd-path: ./cmd/julius
      build-binary-name: julius
    secrets: inherit
