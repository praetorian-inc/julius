version: 2

project_name: julius

builds:
  - main: ./cmd/julius
    binary: julius
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

sboms:
  - artifacts: archive

# cosign keyless OIDC signing of checksums.txt — cosign v3 modern Sigstore
# .sigstore.json bundle. The central go-release.yml installs cosign v3 via
# cosign-installer v4.1.2; sign-blob --bundle is the v3 form (v2's
# --output-certificate/--output-signature were removed in cosign v3).
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
