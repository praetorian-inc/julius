      /health:
        status: 200
        method: GET
        headers:
          Content-Type: application/json
        body: |-
          {
            "status": "error",
            "platform": "hermes-agent",
            "version": "test-version"
          }
  - name: negative-html-content-type
    match: false
    responses:
      /health:
        status: 200
        method: GET
        headers:
          Content-Type: text/html
        body: |-
          {
            "status": "ok",
            "platform": "hermes-agent",
            "version": "test-version"
          }
  - name: negative-health-unauthorized
    match: false
