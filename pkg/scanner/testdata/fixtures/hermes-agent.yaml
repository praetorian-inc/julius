        body: |-
          {
            "status": "ok",
            "platform": "hermes-agent",
            "version": "test-version"
          }
  - name: negative-capabilities-wrong-object
    match: false
    responses:
      /v1/capabilities:
        status: 200
        method: GET
        headers:
          Content-Type: application/json
        body: |-
          {
            "object": "other.api_server.capabilities",
            "platform": "hermes-agent",
            "model": "test-profile"
          }
  - name: negative-capabilities-wrong-platform
    match: false
    responses:
      /v1/capabilities:
        status: 200
        method: GET
        headers:
          Content-Type: application/json
        body: |-
          {
            "object": "hermes.api_server.capabilities",
            "platform": "other-service",
            "model": "test-profile"
          }
  - name: negative-capabilities-unauthorized
    match: false
    responses:
      /v1/capabilities:
        status: 401
        method: GET
        headers:
          Content-Type: application/json
        body: |-
          {
            "object": "hermes.api_server.capabilities",
            "platform": "hermes-agent",
            "model": "test-profile"
          }
  - name: negative-not-found
    match: false
    responses:
      /health:
        status: 404
        method: GET
        headers:
          Content-Type: application/json
        body: |-
          {
            "status": "ok",
            "platform": "hermes-agent",
            "version": "test-version"
          }
  - name: negative-json-string-mention
    match: false
    responses:
      /health:
        status: 200
        method: GET
        headers:
          Content-Type: application/json
        body: |-
          {
            "status": "ok",
            "message": "{\"status\":\"ok\",\"platform\":\"hermes-agent\",\"version\":\"test-version\"}"
          }
  - name: negative-empty-json
    match: false
    responses:
      /health:
        status: 200
        method: GET
        headers:
          Content-Type: application/json
        body: '{}'
  - name: negative-versioned-health-wrong-platform
    match: false
    responses:
      /v1/health:
        status: 200
        method: GET
        headers:
          Content-Type: application/json
        body: '{"status":"ok","platform":"other-service","version":"test-version"}'
