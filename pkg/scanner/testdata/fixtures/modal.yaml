# Golden-file fixtures for the modal probe.
# Validated by pkg/scanner/fixture_test.go against probes/modal.yaml.
probe: modal
cases:
  # Modal's HTTP infra returns this 404 body on any invalid function path.
  - name: positive
    match: true
    responses:
      /praetorian-nonexistent-probe-path:
        status: 404
        headers:
          Content-Type: text/plain; charset=utf-8
        body: "modal-http: invalid function call"

  # A generic 404 from an unrelated server: right status, but no modal marker.
  # Guards the body marker (status alone must not match).
  - name: negative-generic-404
    match: false
    responses:
      /praetorian-nonexistent-probe-path:
        status: 404
        headers:
          Content-Type: text/html
        body: "<html><head><title>404 Not Found</title></head><body>nginx</body></html>"
