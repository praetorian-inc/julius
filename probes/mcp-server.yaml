# probes/mcp-server.yaml
# Reference: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports
# Reference: https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization (RFC 9728)
#
# Model Context Protocol (MCP) servers expose tools/resources to LLM clients over the
# Streamable HTTP transport using JSON-RPC 2.0. MCP is "JSON-RPC plus a semantic layer":
# this probe keys on the MCP-SPECIFIC parts of that layer and NOT on bare
# `"jsonrpc":"2.0"`, so it does not false-positive on generic JSON-RPC services
# (Ethereum/Bitcoin RPC, LSP-over-HTTP, etc.).
#
# Vectors 1–2 target the 2026-07-28 spec (server/discover, stateless, _meta envelope,
# mcp-method header). Vectors 3–4 target the 2025-06-18 spec (initialize handshake) for
# backward compatibility with servers that haven't upgraded yet.
#
# SCOPE (per team consensus): Julius answers "is THIS url an MCP server? yes/no". It does
# NOT discover the endpoint path — MCP can live at /, /mcp, /api/mcp, per-tenant paths, etc.
# Finding those URLs is the crawler/Vespasian/registry job; Julius is handed a URL and
# classifies it. Therefore EVERY vector below uses `path: ""` so it tests the EXACT target
# URL as supplied (target + "" = target) and makes no assumption about the path. Feed Julius
# the discovered endpoint URL directly, or use `--base-paths` to graft a discovered prefix
# onto host-level scans. (The RFC 9728 /.well-known/oauth-protected-resource doc is a
# host-root discovery/extraction concern — recovering the endpoint path and reading
# `authorization_servers` — which belongs in the upstream crawler, not in this classifier.)
name: mcp-server
description: Model Context Protocol (MCP) server - Streamable HTTP transport (JSON-RPC 2.0) for LLM tool/resource access
category: mcp
port_hint: 443
specificity: 90
require: any
api_docs: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports

requests:
  # ---- 2026-07-28 spec vectors ----

  # Vector 1: server/discover (2026-07-28, open server)
  # The stateless discovery call replaces the old initialize handshake. The _meta
  # envelope uses namespaced keys (io.modelcontextprotocol/*) and the mcp-method
  # request header is mandatory. The response carries serverInfo inside _meta and
  # a supportedVersions array at the top level.
  - type: http
    path: ""
    method: POST
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
      MCP-Protocol-Version: "2026-07-28"
      mcp-method: server/discover
    body: '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
    match:
      - type: body.contains
        value: '"supportedVersions"'
      - type: body.contains
        value: io.modelcontextprotocol/serverInfo

  # Vector 2: server/discover (2026-07-28, OAuth-protected server)
  # An auth-required server returns 401 with a WWW-Authenticate header pointing at
  # RFC 9728 protected-resource metadata. We match on resource_metadata in the challenge
  # to distinguish from generic OAuth APIs.
  - type: http
    path: ""
    method: POST
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
      MCP-Protocol-Version: "2026-07-28"
      mcp-method: server/discover
    body: '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
    match:
      - type: status
        value: 401
      - type: header.contains
        header: WWW-Authenticate
        value: resource_metadata

  # ---- 2025-06-18 spec vectors (backward compat) ----

  # Vector 3: initialize (2025-06-18, open server)
  # The old handshake for servers that haven't upgraded to the 2026-07-28 spec.
  # A real MCP server replies with a JSON-RPC result carrying protocolVersion +
  # serverInfo. NOTE: the reply may be either application/json OR an SSE `data: {...}`
  # line (both seen in the wild — DeepWiki, Context7), so we match on body markers
  # only and add no content-type rule here.
  - type: http
    path: ""
    method: POST
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
      MCP-Protocol-Version: "2025-06-18"
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"julius","version":"1.0"}}}'
    match:
      - type: body.contains
        value: '"protocolVersion"'
      - type: body.contains
        value: '"serverInfo"'

  # Vector 4: initialize (2025-06-18, OAuth-protected server)
  # Older auth-required servers return 401 with WWW-Authenticate + MCP-Protocol-Version
  # response header. We require the response header to avoid false-positives on non-MCP
  # APIs that happen to use RFC 9728 OAuth challenges.
  - type: http
    path: ""
    method: POST
    headers:
      Content-Type: application/json
      Accept: application/json, text/event-stream
      MCP-Protocol-Version: "2025-06-18"
    body: '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"julius","version":"1.0"}}}'
    match:
      - type: status
        value: 401
      - type: header.contains
        header: WWW-Authenticate
        value: resource_metadata
      - type: header.contains
        header: MCP-Protocol-Version
        value: ""

# Augustus: emit the MCP generator config for a detected server so consumers
# (Guard's augustus capability) can scan it without fabricating one.
augustus:
  generator: mcp
  config_template:
    endpoint: "$TARGET"
    extra:
      transport: streamable-http
      mode: list_tools
